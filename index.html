<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Swap</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Add Skill Form -->
<section>
  <h2>Add a Skill</h2>

  <form id="skill-form">

    <input
      type="text"
      id="skill-title"
      placeholder="Skill title"
      required
    >

    <select id="skill-category" required>
      <option value="">Select category</option>
      <option value="Programming">Programming</option>
      <option value="Music">Music</option>
      <option value="Career">Career</option>
    </select>

    <input
      type="number"
      id="skill-price"
      placeholder="Price"
      min="0"
      required
    >

    <input
      type="text"
      id="skill-description"
      placeholder="Description"
      required
    >

    <button type="submit">
      Add Skill
    </button>

  </form>
</section>


<!-- Main Content -->
<main class="main-content">

  <section id="explore">

    <div class="section-header">
      <h2>Explore Skills</h2>
      <p>
        Connect with peers offering hands-on mentorship and collaboration.
      </p>
    </div>


    <div class="filter-container">

      <button class="filter-btn" data-category="All">
        All
      </button>

      <button class="filter-btn" data-category="Programming">
        Programming
      </button>

      <button class="filter-btn" data-category="Music">
        Music
      </button>

      <button class="filter-btn" data-category="Career">
        Career
      </button>

    </div>


    <section class="calculator-section">

      <h2>Session Cost Calculator</h2>

      <form id="cost-calculator-form">

        <div class="form-group">

          <label for="hourly-rate">
            Hourly Rate ($):
          </label>

          <input
            type="number"
            id="hourly-rate"
            min="0"
            step="0.01"
            placeholder="e.g. 25"
            required
          >

        </div>


        <div class="form-group">

          <label for="session-hours">
            Hours Needed:
          </label>

          <input
            type="number"
            id="session-hours"
            min="0"
            step="0.5"
            placeholder="e.g. 1.5"
            required
          >

        </div>


        <button type="submit" id="calculate-btn">
          Calculate Total Cost
        </button>

      </form>

      <div
        id="cost-result"
        class="result-display">
      </div>

    </section>


    <!-- Backend skills appear here -->
    <div
      id="skills-container"
      class="skills-grid">
    </div>

  </section>

</main>


<script src="api-service.js"></script>
<script src="script.js"></script>

</body>
</html>
